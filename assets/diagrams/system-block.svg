<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-label="Electronics block diagram: GNSS, lidar and camera feed the Raspberry Pi 5; the IMU and safety inputs feed the Pico 2 safety MCU, which talks to the Pi over UART and drives the blade enable; the Pi commands three motor controllers over CAN and talks to the phone app over Wi-Fi and BLE.">
