<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-label="Power architecture: the battery feeds a fused traction bus through a latching e-stop and precharge to the drive and blade controllers, and a separate always-on logic branch through DC-DC converters to the Pi 5, the safety MCU, sensors and lidar. The dock charges only through the BMS.">
