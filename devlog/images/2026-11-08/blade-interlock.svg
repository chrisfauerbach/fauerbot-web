<rect x="290" y="140" width="110" height="60" rx="6" fill="#ffffff" stroke="#14231a" stroke-width="1.5"/>
<text x="345.0" y="167.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#14231a" text-anchor="middle">Lift left</text>
<text x="345.0" y="182.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#5d6b62" text-anchor="middle">NC hall</text>
<polyline points="400.0,170.0 420.0,170.0" fill="none" stroke="#14231a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="420" y="140" width="110" height="60" rx="6" fill="#ffffff" stroke="#14231a" stroke-width="1.5"/>
<text x="475.0" y="167.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#14231a" text-anchor="middle">Lift right</text>
<text x="475.0" y="182.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#5d6b62" text-anchor="middle">NC hall</text>
<polyline points="530.0,170.0 550.0,170.0" fill="none" stroke="#14231a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="550" y="140" width="110" height="60" rx="6" fill="#ffffff" stroke="#14231a" stroke-width="1.5"/>
<text x="605.0" y="167.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#14231a" text-anchor="middle">Tilt</text>
<text x="605.0" y="182.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#5d6b62" text-anchor="middle">NC switch &lt; 30°</text>
