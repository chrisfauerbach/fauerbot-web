<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" role="img" aria-label="Blade interlock: a 12 V supply passes through normally-closed e-stop, lift, tilt and watchdog contacts and the Pico's blade request in series to the blade controller's enable. The watchdog needs a pulse every 100 ms from the Pico, which needs a heartbeat from ROS.">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#14231a"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9500c"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a6fd0"/></marker></defs>
<rect width="1100" height="500" fill="#f7f9f6"/>
<rect x="8" y="8" width="1084" height="484" fill="none" stroke="#c9d3c5" stroke-width="1"/>
<text x="28" y="44" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#14231a">Blade interlock: a hardware AND</text>
<text x="28" y="66" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#5d6b62">Normally-closed contacts in series. Any open contact, a cut wire or a dead MCU removes ENABLE and the blade brakes.</text>
<rect x="28" y="140" width="110" height="60" rx="6" fill="#ffffff" stroke="#14231a" stroke-width="1.5"/>
<text x="83.0" y="167.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#14231a" text-anchor="middle">+12 V</text>
<text x="83.0" y="182.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#5d6b62" text-anchor="middle">interlock supply</text>
<polyline points="138.0,170.0 160.0,170.0" fill="none" stroke="#14231a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="160" y="140" width="110" height="60" rx="6" fill="#ffffff" stroke="#14231a" stroke-width="1.5"/>
<text x="215.0" y="167.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#14231a" text-anchor="middle">E-stop</text>
<text x="215.0" y="182.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#5d6b62" text-anchor="middle">NC</text>
