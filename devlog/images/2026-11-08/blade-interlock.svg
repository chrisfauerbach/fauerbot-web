<text x="735.0" y="338.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#5d6b62" text-anchor="middle">toggles every &lt; 50 ms</text>
<polyline points="735.0,300.0 735.0,200.0" fill="none" stroke="#d9500c" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
<text x="735.0" y="254.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#d9500c" text-anchor="middle">pulse</text>
<rect x="430" y="300" width="170" height="52" rx="6" fill="#ffffff" stroke="#14231a" stroke-width="1.5"/>
<text x="515.0" y="323.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#14231a" text-anchor="middle">Raspberry Pi (ROS)</text>
<text x="515.0" y="338.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#5d6b62" text-anchor="middle">heartbeat + mow request</text>
<polyline points="600.0,326.0 660.0,326.0" fill="none" stroke="#14231a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="630.0" y="320.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#5d6b62" text-anchor="middle">UART</text>
<polyline points="810.0,326.0 865.0,326.0 865.0,200.0" fill="none" stroke="#2a6fd0" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
<text x="873.0" y="285.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="500" fill="#2a6fd0" text-anchor="start">request</text>
<text x="28.0" y="395.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#14231a" text-anchor="start">What opens the chain</text>
<text x="28.0" y="418.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#14231a" text-anchor="start">wire cut / connector unplugged</text>
<text x="258.0" y="418.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5d6b62" text-anchor="start">→ open circuit</text>
<text x="548.0" y="418.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#14231a" text-anchor="start">robot lifted or tipped</text>
<text x="778.0" y="418.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5d6b62" text-anchor="start">→ lift / tilt contact opens</text>
<text x="28.0" y="438.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#14231a" text-anchor="start">Pico hangs</text>
<text x="258.0" y="438.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5d6b62" text-anchor="start">→ pulse stops → one-shot times out</text>
<text x="548.0" y="438.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#14231a" text-anchor="start">Pi or ROS crashes</text>
<text x="778.0" y="438.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#5d6b62" text-anchor="start">→ no heartbeat → Pico drops request</text>
<text x="1072" y="480" font-family="IBM Plex Mono, ui-monospace, Menlo, monospace" font-size="10" fill="#5d6b62" text-anchor="end">FAUERBOT · generated by scripts/make_diagrams.py</text>
