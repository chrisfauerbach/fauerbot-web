<text x="735.0" y="182.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#5d6b62" text-anchor="middle">one-shot 100 ms</text>
<polyline points="790.0,170.0 810.0,170.0" fill="none" stroke="#14231a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="810" y="140" width="110" height="60" rx="6" fill="#ffffff" stroke="#14231a" stroke-width="1.5"/>
<text x="865.0" y="167.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#14231a" text-anchor="middle">Blade request</text>
