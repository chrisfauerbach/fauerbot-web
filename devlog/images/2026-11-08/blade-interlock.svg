<polyline points="920.0,170.0 950.0,170.0" fill="none" stroke="#d9500c" stroke-width="2.4" marker-end="url(#arrow-accent)"/>
<rect x="950" y="136" width="120" height="68" rx="6" fill="#fff4ee" stroke="#d9500c" stroke-width="2.4"/>
<text x="1010.0" y="167.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600" fill="#d9500c" text-anchor="middle">ENABLE</text>
<text x="1010.0" y="182.0" font-family="IBM Plex Sans, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="400" fill="#5d6b62" text-anchor="middle">blade controller</text>
<rect x="660" y="300" width="150" height="52" rx="6" fill="#ffffff" stroke="#14231a" stroke-width="1.5"/>
