<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="ROS 2 data flow: ros_gz_bridge feeds gnss_noise and wheel_odom; navsat_transform turns GNSS into map-frame odometry; ekf_global and ekf_local fuse wheels, IMU and GNSS; square_driver commands the robot; es_shipper sends telemetry to Elasticsearch. Planned: Nav2, a lidar safety node and a phone gateway.">
